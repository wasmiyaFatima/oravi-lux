<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oravi Lux - 3D emblem</title>
  </head>
  <body>
    <div id="app">
      <canvas id="stage"></canvas>
      <aside class="panel" aria-label="Emblem controls">
        <p class="kicker">Studio</p>
        <h1>Oravi Lux</h1>
        <p class="lede">Champagne-gold metal from the original SVG paths.</p>

        <label>
          Extrusion depth
          <input id="depth" type="range" min="3" max="22" step="0.1" />
        </label>
        <label>
          Bevel
          <input id="bevel" type="range" min="0" max="1.2" step="0.01" />
        </label>
        <label>
          Metallic
          <input id="metal" type="range" min="0.4" max="1" step="0.01" />
        </label>
        <label>
          Roughness
          <input id="rough" type="range" min="0.08" max="0.7" step="0.01" />
        </label>
        <label>
          Light intensity
          <input id="light" type="range" min="0.35" max="1.8" step="0.01" />
        </label>
        <label>
          Background
          <input id="bg" type="color" />
        </label>

        <div class="row">
          <button type="button" data-view="front">Front</button>
          <button type="button" data-view="threeQuarter">3/4</button>
          <button type="button" data-view="side">Side</button>
        </div>
        <button type="button" class="reset" id="reset">Reset camera</button>
        <p class="hint">Drag to orbit. Scroll to move closer.</p>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
